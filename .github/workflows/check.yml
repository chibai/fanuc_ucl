name: C++23

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Locate Boost (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $boost = Get-ChildItem Env: | Where-Object Name -Like 'BOOST_ROOT_*' | Select-Object -First 1
          if (-not $boost) { throw "Boost headers are not installed on this runner" }
          "BOOST_ROOT=$($boost.Value)" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ matrix.configuration }} --prefix install
      - name: Configure installed package consumer
        run: >-
          cmake -S cpp/tests/package -B build/consumer
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
      - name: Build installed package consumer
        run: cmake --build build/consumer --config ${{ matrix.configuration }} --parallel
      - name: Test installed package consumer
        run: ctest --test-dir build/consumer -C ${{ matrix.configuration }} --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
